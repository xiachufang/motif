name: Flutter checks

on:
  pull_request:
    paths:
      - 'apps/flutter/**'
      - 'patches/ghostty/**'
      - 'scripts/apply_ghostty_patches.sh'
      - 'scripts/build_ghostty.sh'
      - '.github/workflows/flutter-checks.yml'
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - 'patches/ghostty/**'
      - 'scripts/apply_ghostty_patches.sh'
      - 'scripts/build_ghostty.sh'
      - '.github/workflows/flutter-checks.yml'

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Disable native builds for pure tests
        run: touch .dart_tool/motif_skip_native_assets
      - run: flutter analyze --no-pub
      - name: Pure Dart and widget tests
        run: >-
          flutter test --no-pub --concurrency=1 test/motif
          --exclude-tags='native || tailscale || live || tailscale_live'

  build-android-arm64-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Keep this as a single arm64 APK. Let `flutter build` run pub so it
      # regenerates the release plugin registrant without dev-only plugins.
      - name: Build arm64 release APK
        run: >-
          flutter build apk --release --target-platform android-arm64
          --split-per-abi
      - name: Package APK artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$source_apk"
          abis="$(unzip -Z1 "$source_apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          test "$abis" = arm64-v8a || {
            echo "::error::Expected only arm64-v8a libraries, found: $abis"
            exit 1
          }
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          suffix="${version/+/-}"
          artifact_name="Motif-${suffix}-android-arm64"
          mkdir -p ../../dist/ci
          cp "$source_apk" "../../dist/ci/${artifact_name}.apk"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/ci/*.apk
          if-no-files-found: error
          retention-days: 14
