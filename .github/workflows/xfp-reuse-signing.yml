name: Transfer XFP signing secrets securely
on: workflow_dispatch
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install PyNaCl==1.5.0
      - name: Seal secrets to the XFP repository public key
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PYCODE'
          import os,json,base64
          from pathlib import Path
          from nacl.public import PublicKey,SealedBox
          box=SealedBox(PublicKey(base64.b64decode('5D7uDujABDojR6Wf5vn24w8rkzlodqrzstsLsA7Lwmc=')))
          names=['MACOS_DEVELOPER_ID_P12_BASE64', 'MACOS_DEVELOPER_ID_P12_PASSWORD', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER_ID', 'APPLE_API_PRIVATE_KEY_BASE64']
          result={}
          for name in names:
              value=os.environ.get(name)
              if not value: raise SystemExit("Missing secret: "+name)
              result[name]=base64.b64encode(box.encrypt(value.encode())).decode()
          Path("sealed.json").write_text(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: xfp-sealed-signing
          path: sealed.json
          retention-days: 1
