name: release-android

# Build the installable arm64 Android APK and append it to the GitHub Release
# created for the pushed tag. Manual runs keep the APK as an Actions artifact
# so the release build can be tested without publishing it.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    uses: ./.github/workflows/version-check.yml

  build:
    needs: check-version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Flutter native-asset hook builds Ghostty with Zig and libtailscale
      # with Go. Android Gradle Plugin 9 requires JDK 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Let `flutter build` run pub so it regenerates the release plugin
      # registrant without dev-only plugins such as integration_test.
      - name: Build arm64 release APK
        run: >-
          flutter build apk --release --target-platform android-arm64
          --split-per-abi

      - name: Package and verify APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$source_apk"
          abis="$(unzip -Z1 "$source_apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          test "$abis" = arm64-v8a || {
            echo "::error::Expected only arm64-v8a libraries, found: $abis"
            exit 1
          }
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          suffix="${version/+/-}"
          artifact_name="Motif-${suffix}-android-arm64"
          mkdir -p ../../dist/release
          cp "$source_apk" "../../dist/release/${artifact_name}.apk"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # This create-or-update operation appends the APK to the same Release as
      # the desktop, macOS, and motifd release workflows.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/release/*.apk
          fail_on_unmatched_files: true
