name: release-motifd

# Build standalone Linux/macOS/Windows motifd binaries and upload them to the GitHub
# Release for the pushed tag. The production container workflow remains
# separate: this one is for users who want the raw daemon binary outside Docker.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: release-motifd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  CC_x86_64_unknown_linux_musl: musl-gcc
  CXX_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

jobs:
  # Gate: on tag pushes, fail fast if the tag and pubspec version disagree
  # before spending build minutes. No-op on workflow_dispatch.
  check-version:
    uses: ./.github/workflows/version-check.yml

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # xcap's PipeWire 0.10 bindings need SPA headers newer than the
          # 0.3.48 headers shipped by Ubuntu 22.04.
          - os: ubuntu-24.04
            target: release-motifd-linux
            artifact: motifd-linux-x86_64
            verify_run: true
          - os: macos-15
            target: release-motifd-macos
            artifact: motifd-macos-arm64
            verify_run: true
          - os: windows-latest
            target: release-motifd-windows
            artifact: motifd-windows-x86_64
            verify_run: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-go@v5
        with:
          # Go 1.26's runtime/cgo fails against musl's clearenv declaration
          # because its unused compatibility parameter is compiled with -Werror.
          go-version: '1.25.5'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils clang cmake file make musl-tools patch pkg-config libclang-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev

      # Go's c-archive startup currently assumes glibc's non-standard
      # .init_array argc/argv extension. musl passes no arguments, so patch the
      # pinned toolchain with the narrowly scoped runtime fix used by motifd.
      # Upstream tracking: https://go.dev/issue/13492
      - name: Patch Go c-archive startup for musl
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          goroot="$(go env GOROOT)"
          patch --batch --forward -p1 -d "$goroot" \
            < scripts/patches/go1.25.5-musl-c-archive.patch

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Build motifd artifact
        shell: bash
        run: make ${{ matrix.target }}

      # Standalone motifd is headless by default, but keep the optional desktop
      # backend compiling on every supported platform for explicit opt-in builds
      # and Flutter's motif-embed feature forwarding.
      - name: Check optional screen-capture backend
        shell: bash
        run: cargo check --locked -p motif-server --features screen-capture

      - name: Verify Linux motifd is static and headless
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find dist/release/motifd -type f -name motifd -print -quit)"
          test -n "$bin"
          file "$bin"

          program_headers="$(readelf --program-headers --wide "$bin")"
          dynamic_section="$(readelf --dynamic --wide "$bin")"
          version_info="$(readelf --version-info --wide "$bin")"

          if grep -q ' INTERP ' <<<"$program_headers"; then
            echo "standalone motifd unexpectedly has a dynamic interpreter" >&2
            exit 1
          fi
          if grep -q '(NEEDED)' <<<"$dynamic_section"; then
            echo "standalone motifd unexpectedly has dynamic library dependencies" >&2
            exit 1
          fi
          if grep -q 'GLIBC_' <<<"$version_info"; then
            echo "standalone motifd unexpectedly requires glibc symbols" >&2
            exit 1
          fi

      - name: Verify motifd starts
        if: matrix.verify_run
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find dist/release/motifd -type f \( -name 'motifd' -o -name 'motifd.exe' \) -print -quit)"
          test -n "$bin"
          expected="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]; exit}' apps/flutter/pubspec.yaml)"
          actual="$("$bin" --version)"
          echo "$actual"
          grep -F "$expected" <<<"$actual"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/motifd-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: motifd-*
          merge-multiple: true

      - name: List release assets
        run: ls -l dist/release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/release/motifd-*.tar.gz
          fail_on_unmatched_files: true

      # The publish job only runs after every build and executable verification
      # succeeds. Each entry therefore points to the newest known-good artifact;
      # an absent/failed future build never replaces it.
      - name: Publish stable motifd metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            'linux-x86_64:motifd-*-linux-x86_64.tar.gz' \
            'macos-arm64:motifd-*-macos-arm64.tar.gz' \
            'windows-x86_64:motifd-*-windows-x86_64.tar.gz'
          do
            platform="${spec%%:*}"
            pattern="${spec#*:}"
            artifact="$(find dist/release -maxdepth 1 -type f -name "$pattern" -print -quit)"
            test -n "$artifact"
            python3 scripts/publish_release_metadata.py \
              --product motifd \
              --platform "$platform" \
              --artifact "$artifact"
          done
